name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Run the gates on pull requests too, not only at merge. Checks that fire for
  # the first time on the merge commit tell you a change was bad after it has
  # landed on main, which is the wrong end of the process to learn it. The deploy
  # job below is guarded so only a push to main can actually ship.
  pull_request:
    branches: [main]
  # Lets the deploy be re-run from the Actions tab (or `gh workflow run`) without
  # inventing a dummy commit — needed whenever only a repository *secret* has
  # changed, since editing a secret does not itself trigger anything.
  workflow_dispatch:

env:
  PROJECT_ID: civos-in
  REGION: asia-south1
  API_SERVICE: civos-api
  CONSOLE_SERVICE: civos-console

jobs:
  # ── Gate: no country literals in core/ ──────────────────────────────────────
  # SPEC P0-14 claims a second country is a config directory, not a code change.
  # This job is the evidence for that claim, so it gates the deploy rather than
  # trailing it — a check that runs after shipping is theatre.
  #
  # It deliberately needs no GCP credentials, which is why it is a separate job
  # and not a step inside Build & Deploy: a country literal reaching core/ should
  # fail before anything touches the cloud, and the check earns its own line in
  # the Actions UI where a reviewer can actually see it went green.
  lint:
    name: Country lint (SPEC P0-14)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the linter itself imports, not the whole project. `uv sync`
      # would pull google-cloud-*, fastapi and pillow to run an AST walk. Floors
      # mirror pyproject.toml; if the linter grows an import, this fails loudly
      # with ImportError rather than passing quietly.
      - name: Install the linter's dependencies
        run: pip install --quiet "typer>=0.12" "pyyaml>=6.0" "rich>=13.7"

      # Prove the gate can fail before trusting it to pass. Without this, a
      # linter broken into always returning PASS would show green forever, and
      # the CI badge would be worth less than no badge at all.
      - name: Prove the gate can actually fail
        run: |
          mkdir -p .lintcheck
          printf 'COUNTRY = "India"\nSCHEME = "Jal Jeevan Mission"\n' > .lintcheck/violation.py
          if python scripts/lint_country_literals.py --path .lintcheck; then
            echo "::error::The country lint PASSED a file containing \"India\" and a named scheme. The gate is broken, so its green result on core/ means nothing."
            rm -rf .lintcheck
            exit 1
          fi
          rm -rf .lintcheck
          echo "Negative control OK — the linter rejects a deliberate violation."

      # The real check. The pre-flight count matters: the linter only walks *.py
      # and reports PASS when it matched nothing, so a moved, renamed or emptied
      # core/ would otherwise sail through as a green zero-file run. Counting the
      # inputs ourselves is checked rather than scraped — the linter prints
      # through rich, which interleaves ANSI codes between the words, so grepping
      # its prose for "Scanned 0 files" is an assertion that silently stops
      # matching the day colour output changes.
      - name: Lint core/ for country literals
        run: |
          FILES=$(find core -name '*.py' -type f | wc -l | tr -d ' ')
          echo "core/ contains $FILES Python file(s)"
          if [ "$FILES" -eq 0 ]; then
            echo "::error::Found 0 Python files under core/. It is missing, renamed or empty, so a PASS from the linter would be meaningless."
            exit 1
          fi
          python scripts/lint_country_literals.py

  # ── Gate: the test suite, including the security tests ──────────────────────
  # Same reasoning as the country lint: a suite that only runs on a laptop is a
  # suite that stops running. tests/test_security.py asserts the upload caps,
  # rate limits, prompt-injection control, error opacity and SPEC 11 privacy
  # invariants — none of which are visible in a code review of a later change.
  #
  # Costs nothing to run: Gemini is mocked throughout, so CI cannot spend money.
  test:
    name: Tests (incl. security)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run the suite
        run: uv run pytest -q

  # ── Gate: dependency and static analysis ────────────────────────────────────
  # Advisory-only for scripts/ (build-time data tooling, not the served surface)
  # but blocking for api/ and core/, which is what a request actually reaches.
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      # The lockfile must match pyproject before anything is graded against it.
      # A stale lockfile means CI audits, and the image installs, a set nobody
      # chose.
      - name: Lockfile is in sync with pyproject
        run: uv lock --check

      # Known CVEs in the SHIPPED dependency set. Exported from the committed
      # lockfile with --frozen, so this grades exactly what the Dockerfile
      # installs — the previous form audited a fresh `uv pip freeze`, which is a
      # resolution that may never have been deployed.
      # Blocking: shipping a service with a published advisory is not a
      # judgement call.
      - name: pip-audit (the locked set)
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/locked.txt
          COUNT=$(grep -cE '^[A-Za-z0-9._-]+==' /tmp/locked.txt || true)
          test "$COUNT" -gt 0 || { echo "::error::exported 0 packages — the audit would pass vacuously"; exit 1; }
          echo "auditing $COUNT locked packages"
          uvx --python 3.12 pip-audit -r /tmp/locked.txt --no-deps --progress-spinner off

      # Blocking on the served surface only. scripts/ legitimately shells out and
      # opens URLs to build the data layer; failing the deploy on that would
      # train everyone to ignore the job.
      - name: bandit (api/ and core/ — blocking)
        run: uvx --python 3.12 bandit -r api core -ll

      - name: bandit (scripts/ — advisory)
        continue-on-error: true
        run: uvx --python 3.12 bandit -r scripts -ll

      # The control that actually stopped a live secret leak: .dockerignore is
      # what keeps .env out of an image layer built by `COPY . .`.
      - name: Assert secrets cannot enter the build context
        run: |
          grep -qx '\.env' .dockerignore || { echo "::error::.dockerignore does not exclude .env — COPY . . would bake TELEGRAM_BOT_TOKEN into an image layer."; exit 1; }
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git."; exit 1
          fi
          echo "Build context and index are clean of .env."

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Never deploy from a pull request. A PR build must not be able to ship, and
    # secrets are not exposed to pull_request runs anyway — without this guard the
    # job would fail confusingly on every PR instead of being skipped.
    if: github.event_name != 'pull_request'
    # A country literal in core/ falsifies the cross-border claim, which is 20%
    # of the score. A failing security test means the deployed surface is not the
    # reviewed surface. Do not ship past either.
    needs: [lint, test, security]
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Authenticate with Google Cloud ────────────────────────────────
      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 3. Deploy FastAPI (civos-api) ─────────────────────────────────────
      - name: Deploy API
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars CIVOS_PROJECT=${{ env.PROJECT_ID }},CIVOS_BQ_LOCATION=${{ env.REGION }},CIVOS_BQ_DATASET=civos,CIVOS_BQ_CONNECTION=civos_vertex,CIVOS_GEMINI_MODEL=gemini-2.5-flash,TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }} \
            --memory 1Gi \
            --timeout 120 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      # ── 4. Read API URL for console env var ──────────────────────────────
      - name: Get API URL
        id: api_url
        run: |
          URL=$(gcloud run services describe ${{ env.API_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ── 5. Deploy Next.js console (civos-console) ────────────────────────
      - name: Deploy Console
        working-directory: console
        run: |
          gcloud run deploy ${{ env.CONSOLE_SERVICE }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --set-env-vars BACKEND_URL=${{ steps.api_url.outputs.url }} \
            --memory 512Mi \
            --timeout 60 \
            --min-instances 0 \
            --max-instances 2 \
            --quiet

      # ── 6. Point Telegram at the freshly-deployed webhook ─────────────────
      # Cloud Run scales to zero, so long-polling cannot run there. Telegram
      # pushes updates to /telegram/webhook instead, authenticated by a secret
      # header. Re-registered on every deploy so the URL can never go stale.
      #
      # Skipped rather than failed when the secrets are absent: the rest of the
      # deploy is independent of the messaging channel, and a missing bot token
      # should not take the console down with it.
      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          API_URL: ${{ steps.api_url.outputs.url }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$HOOK_SECRET" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_WEBHOOK_SECRET not set — skipping webhook registration. The bot will not answer."
            exit 0
          fi
          # --data-urlencode keeps the values out of the process list and the log.
          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${API_URL}/telegram/webhook" \
            --data-urlencode "secret_token=${HOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","edited_message"]' \
            --data-urlencode "drop_pending_updates=true")
          echo "$RESP" | grep -q '"ok":true' || { echo "setWebhook failed: $RESP"; exit 1; }
          echo "Telegram webhook → ${API_URL}/telegram/webhook"

      # ── 7. Print the live URLs ────────────────────────────────────────────
      # Both read back from gcloud. The console URL used to be hardcoded and had
      # already gone stale against the real service — a wrong URL printed at the
      # end of a green deploy is worse than none, because it gets trusted.
      - name: Print live URLs
        run: |
          CONSOLE=$(gcloud run services describe ${{ env.CONSOLE_SERVICE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "API     → ${{ steps.api_url.outputs.url }}"
          echo "Console → $CONSOLE"
          echo "Landing → $CONSOLE/"
          echo "Intake  → $CONSOLE/report"
