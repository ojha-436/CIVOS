<!doctype html>
<meta charset="utf-8">
<title>CIVOS — launch film stage</title>
<!--
  The animation stage for the CIVOS introduction film.

  This page is a pure function of time. Nothing here uses CSS transitions, CSS
  animations or requestAnimationFrame: every scene exposes render(t) and sets
  styles from scratch for that instant. That is what lets the renderer seek to
  frame 2 471, screenshot it, and get exactly the same pixels every run — and it
  is why the film can be re-cut just by re-running narrate.py, because scene
  boundaries come from measured audio in timings.js rather than hand-typed guesses.

  Design language is lifted wholesale from console/app/globals.css ("The
  Instrument"): ink ground, cream ink-on-paper inverted, hairline rules,
  calibration ticks, tabular figures, and the rule that Silent Need gold is the
  only element permitted to glow.

  Open it directly in a browser to scrub with the arrow keys / slider.
-->
<script src="timings.js"></script>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../console/app/fonts/InstrumentSerif-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plex"; src: url("../console/app/fonts/IBMPlexSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Plex"; src: url("../console/app/fonts/IBMPlexSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Plex"; src: url("../console/app/fonts/IBMPlexSans-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: "PlexMono"; src: url("../console/app/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "PlexMono"; src: url("../console/app/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }

  :root {
    --ink-900:#070a0e; --ink-800:#0b0f15; --ink-700:#10151d; --ink-600:#161d27;
    --paper:#ece5d8; --paper-2:#b9b3a8; --paper-3:#8b95a3; --paper-4:#707c8e;
    --rule:rgba(236,229,216,.11); --rule-strong:rgba(236,229,216,.22); --tick:rgba(236,229,216,.30);
    --q-act:#ff6a45; --q-silent:#f3c14b; --q-gap:#57c4e5; --q-stable:#566273;
    --gold:#f3c14b;
  }

  /* Determinism guard: a stray transition would make frame N depend on frame N-1. */
  *, *::before, *::after { transition: none !important; animation: none !important; box-sizing: border-box; }

  html, body { margin:0; padding:0; background:#000; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }

  #stage {
    position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--ink-900); color:var(--paper);
    font-family:"Plex", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Faint off-centre lift, so 1080 lines of flat #070a0e do not band on encode. */
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 62% 34%, rgba(86,98,115,.13), rgba(7,10,14,0) 62%); }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.035;
    background-image:url("assets/grain.png"); background-size:256px 256px; }

  /* The console's left-margin calibration ticks, carried through the whole film. */
  #ticks { position:absolute; left:0; top:0; bottom:0; width:34px; pointer-events:none; }
  #ticks i { position:absolute; left:0; height:1px; background:var(--tick); opacity:.5; }

  #progress { position:absolute; left:0; bottom:0; height:2px; background:var(--gold); opacity:.5; }
  #chapter { position:absolute; right:46px; bottom:34px; font-family:"PlexMono"; font-size:17px;
    letter-spacing:.20em; color:var(--paper-4); }
  #caption { position:absolute; left:260px; right:260px; bottom:74px; text-align:center;
    font-size:31px; line-height:1.4; color:var(--paper); display:none;
    text-shadow:0 2px 18px rgba(7,10,14,.95), 0 0 40px rgba(7,10,14,.85); }

  .scene { position:absolute; inset:0; display:none; }
  .pad { position:absolute; inset:0; padding:84px 120px; }

  .kicker { font-family:"PlexMono"; font-weight:500; font-size:20px; letter-spacing:.26em;
            text-transform:uppercase; color:var(--paper-4); }
  .disp { font-family:"Instrument Serif"; font-weight:400; line-height:1.03; letter-spacing:-.005em; }
  .mono { font-family:"PlexMono"; font-variant-numeric:tabular-nums; }
  .rule { background:var(--rule); }
  .glow { box-shadow:0 0 0 1px var(--gold), 0 0 34px rgba(243,193,75,.30), inset 0 0 60px rgba(243,193,75,.055); }

  img.ui { display:block; border:1px solid var(--rule); background:var(--ink-800); }
</style>

<div id="stage">
  <div id="vignette"></div>
  <div id="ticks"></div>
  <div id="grain"></div>
  <div id="progress"></div>
  <div id="chapter" class="mono"></div>
  <div id="caption"></div>
</div>

<script>
// ───────────────────────────────────────────────────────────────── primitives
const stage = document.getElementById('stage');
const T = window.TIMINGS;
const W = 1920, H = 1080;

const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
/** Normalised progress of t through the window [a,b]. The workhorse. */
const sp = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : cl((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out:  x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in:   x => x * x * x,
  io:   x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2,
  // Slight overshoot, used only where something should feel placed rather than slid.
  back: x => { const c = 1.4; const y = x - 1; return 1 + (c + 1) * y*y*y + c * y*y; },
};
/** Seeded LCG — scatter fields must be identical on every render pass. */
let _seed = 20260820;
const rnd = () => (_seed = (_seed * 1664525 + 1013904223) >>> 0) / 4294967296;

const h = (tag, cls, css, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) Object.assign(e.style, css);
  if (text != null) e.textContent = text;
  return e;
};
const px = n => n + 'px';
/** Position/opacity/transform in one call — the only thing render() ever does. */
const set = (el, o, x, y, s, extra) => {
  el.style.opacity = o;
  const t = [];
  if (x || y) t.push(`translate(${x||0}px,${y||0}px)`);
  if (s != null && s !== 1) t.push(`scale(${s})`);
  if (extra) t.push(extra);
  el.style.transform = t.join(' ');
};
const svg = (d, size, sw) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="${sw||1.25}" stroke-linecap="round"
        stroke-linejoin="round">${d}</svg>`;
const ICON = {
  mic: '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/><path d="M8.5 22h7"/>',
  key: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  cam: '<path d="M3 8.5A2 2 0 0 1 5 6.5h2.3l1.2-2h7l1.2 2H19a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.6" r="3.5"/>',
};

// left-margin calibration ticks
(() => {
  const t = document.getElementById('ticks');
  for (let y = 40; y < H - 20; y += 26) {
    const major = (y - 40) % 130 === 0;
    t.appendChild(h('i', null, { top: px(y), width: px(major ? 22 : 11) }));
  }
})();

// ─────────────────────────────────────────────────────────────────── registry
const SC = {};
/** Every scene gets its own absolutely-positioned root and a render(t,dur). */
function scene(id, build, opts) {
  const root = h('div', 'scene');
  stage.appendChild(root);
  const render = build(root);
  SC[id] = Object.assign({ root, render, fin: .5, fout: .42 }, opts || {});
}

// ══════════════════════════════════════════════════════ 01 · THE SAME MAP
scene('01-hook', root => {
  const p = h('div', 'pad'); root.appendChild(p);
  const k = h('div', 'kicker', { position:'absolute', left:'120px', top:'84px' }, 'The mistake everyone makes');
  p.appendChild(k);

  // A complaint map: dense where people file, empty where they cannot.
  const field = h('div', null, { position:'absolute', left:'300px', top:'150px',
                                 width:'1340px', height:'760px' });
  p.appendChild(field);
  const HOT = [[300,190],[560,300],[880,210],[1010,470],[420,560],[720,620]];
  const dots = [];
  for (let i = 0; i < 210; i++) {
    const clustered = i < 150;
    let x, y;
    if (clustered) {
      const c = HOT[(i * 7) % HOT.length];
      const r = Math.pow(rnd(), .55) * 150;
      const a = rnd() * Math.PI * 2;
      x = c[0] + Math.cos(a) * r; y = c[1] + Math.sin(a) * r * .8;
    } else { x = rnd() * 1290; y = rnd() * 700; }
    x = Math.max(6, Math.min(1300, x)); y = Math.max(6, Math.min(720, y));
    const size = clustered ? 7 + rnd() * 7 : 5;
    const el = h('div', null, {
      position:'absolute', left:px(x), top:px(y), width:px(size), height:px(size),
      borderRadius:'50%',
      background: clustered ? 'var(--q-act)' : 'rgba(236,229,216,.16)',
    });
    field.appendChild(el);
    dots.push({ el, clustered, t0: clustered ? 2.55 + rnd() * 2.35 : .55 + rnd() * 1.4 });
  }

  const lines = [
    { s:'A map of complaints',            g:false, t:5.55 },
    { s:'is a map of who owns a phone.',  g:false, t:6.45 },
    { s:'It is not a map of need.',       g:true,  t:7.85 },
  ].map((L, i) => {
    const el = h('div', 'disp', {
      position:'absolute', left:'120px', top:px(600 + i * 106), fontSize:'82px',
      color: L.g ? 'var(--gold)' : 'var(--paper)',
      textShadow: L.g ? '0 0 40px rgba(243,193,75,.22)' : 'none',
    }, L.s);
    p.appendChild(el);
    return { ...L, el };
  });
  const bar = h('div', null, { position:'absolute', left:'120px', top:'922px',
                               height:'2px', background:'var(--gold)' });
  p.appendChild(bar);

  return t => {
    set(k, sp(t, .25, 1.1) * .95, 0, lerp(-8, 0, E.out(sp(t, .25, 1.2))));
    // Dots recede once the argument arrives — the text has to be the subject.
    const recede = 1 - .82 * E.io(sp(t, 5.3, 6.4));
    for (const d of dots) {
      const a = E.out(sp(t, d.t0, d.t0 + .5));
      set(d.el, a * (d.clustered ? .93 : .8) * recede, 0, 0, lerp(.2, 1, E.back(a)));
    }
    for (const L of lines) {
      const a = sp(t, L.t, L.t + .85);
      set(L.el, E.out(a), 0, lerp(26, 0, E.out5(a)));
    }
    bar.style.width = px(lerp(0, 604, E.out5(sp(t, 8.35, 9.35))));
    bar.style.opacity = .9;
  };
});

// ══════════════════════════════════════════════════════ 02 · WHAT THAT COSTS
scene('02-cost', root => {
  const p = h('div', 'pad'); root.appendChild(p);
  p.appendChild(h('div', 'kicker', { position:'absolute', left:'120px', top:'84px' },
                  'What that costs'));
  const tag = h('div', 'mono', { position:'absolute', right:'120px', top:'86px', fontSize:'17px',
                                 letterSpacing:'.20em', color:'var(--paper-4)' },
                'SCHEMATIC · THE SHAPE OF THE PROBLEM');
  p.appendChild(tag);

  const hdr = y => h('div', 'mono', { position:'absolute', top:px(y), fontSize:'17px',
                                      letterSpacing:'.22em', color:'var(--paper-4)' });
  const cVoice = hdr(196); cVoice.style.left = '408px'; cVoice.textContent = 'CITIZEN VOICE';
  const cDef   = hdr(196); cDef.style.left   = '1058px'; cDef.textContent = 'MEASURED DEFICIT';
  p.appendChild(cVoice); p.appendChild(cDef);

  // Voice descending, deficit deliberately uncorrelated — that gap is the point.
  const DATA = [
    [.97,.31],[.88,.24],[.79,.52],[.71,.19],[.63,.44],[.54,.28],
    [.46,.61],[.37,.35],[.28,.72],[.19,.88],[.12,.94],[.06,.97],
  ];
  const rows = DATA.map(([v, d], i) => {
    const y = 244 + i * 52;
    const invisible = i >= 9;
    const idx = h('div', 'mono', { position:'absolute', left:'120px', top:px(y + 5),
      fontSize:'19px', color:'var(--paper-4)' }, String(i + 1).padStart(2, '0'));
    const line = h('div', null, { position:'absolute', left:'120px', top:px(y + 40),
      width:'1500px', height:'1px', background:'var(--rule)' });
    const bv = h('div', null, { position:'absolute', left:'408px', top:px(y + 8),
      height:'13px', background:'var(--paper-4)', borderRadius:'1px' });
    const bd = h('div', null, { position:'absolute', left:'1058px', top:px(y + 8),
      height:'13px', borderRadius:'1px',
      background: invisible ? 'var(--gold)' : 'var(--paper-4)' });
    const flag = h('div', 'mono', { position:'absolute', top:px(y + 6), fontSize:'16px',
      letterSpacing:'.20em' });
    if (invisible) { flag.style.left = '1655px'; flag.style.color = 'var(--gold)'; flag.textContent = 'INVISIBLE'; }
    else if (i < 4) { flag.style.left = '1655px'; flag.style.color = 'var(--q-act)'; flag.textContent = 'FUNDED'; }
    [idx, line, bv, bd, flag].forEach(e => p.appendChild(e));
    return { i, v, d, invisible, idx, line, bv, bd, flag, funded: i < 4 };
  });

  const caption = h('div', 'disp', { position:'absolute', left:'120px', top:'906px',
    fontSize:'56px', color:'var(--gold)' }, 'Severe need. No voice. No funding.');
  p.appendChild(caption);

  return t => {
    for (const r of rows) {
      const a = E.out(sp(t, .35 + r.i * .07, .95 + r.i * .07));
      set(r.idx, a * .85); r.line.style.opacity = a * .9;
      r.bv.style.width = px(lerp(0, 560, a) * r.v);
      r.bv.style.opacity = a;
      r.bd.style.width = px(lerp(0, 560, a) * r.d);
      // The gold only earns its saturation once we say what it means.
      r.bd.style.opacity = a * (r.invisible ? lerp(.34, 1, E.out(sp(t, 4.35, 5.3))) : 1);
      const ft = r.funded ? 3.05 + r.i * .11 : 4.55 + (r.i - 9) * .17;
      set(r.flag, E.out(sp(t, ft, ft + .5)) * (r.invisible ? 1 : .92));
      if (!r.invisible && !r.funded) r.flag.style.opacity = 0;
      // Everything that is not the argument dims away under the closing line.
      const dim = r.invisible ? 1 : lerp(1, .34, E.io(sp(t, 4.7, 5.9)));
      [r.idx, r.bv, r.bd].forEach(e => e.style.opacity = e.style.opacity * dim);
    }
    set(cVoice, E.out(sp(t, .2, .9)) * .9);
    set(cDef,   E.out(sp(t, .2, .9)) * .9);
    set(tag,    E.out(sp(t, .2, 1.1)) * .8);
    const a = sp(t, 6.2, 7.1);
    set(caption, E.out(a), 0, lerp(22, 0, E.out5(a)));
  };
});

// ══════════════════════════════════════════════════════ 03 · TITLE
scene('03-title', root => {
  const p = h('div', 'pad'); root.appendChild(p);
  const ruleL = h('div', 'rule', { position:'absolute', top:'432px', right:'50%', height:'1px' });
  const ruleR = h('div', 'rule', { position:'absolute', top:'432px', left:'50%', height:'1px' });
  p.appendChild(ruleL); p.appendChild(ruleR);

  const wrap = h('div', null, { position:'absolute', left:'0', right:'0', top:'452px',
    display:'flex', alignItems:'flex-start', justifyContent:'center', gap:'26px' });
  const word = h('div', 'disp', { fontSize:'196px', letterSpacing:'.02em' }, 'CIVOS');
  const chip = h('div', 'mono', { marginTop:'54px', padding:'8px 15px 7px', fontSize:'27px',
    fontWeight:'500', letterSpacing:'.16em', color:'#1b1408', background:'var(--gold)',
    borderRadius:'3px' }, 'IN');
  wrap.appendChild(word); wrap.appendChild(chip); p.appendChild(wrap);

  const sub = h('div', 'mono', { position:'absolute', left:'0', right:'0', top:'700px',
    textAlign:'center', fontSize:'25px', letterSpacing:'.42em', color:'var(--paper-3)' },
    'CIVIC OPERATING SYSTEM');
  p.appendChild(sub);

  const line = h('div', 'disp', { position:'absolute', left:'0', right:'0', top:'782px',
    textAlign:'center', fontSize:'70px', color:'var(--gold)',
    textShadow:'0 0 46px rgba(243,193,75,.30)' }, 'Silence is the signal.');
  p.appendChild(line);

  return t => {
    const r = E.out5(sp(t, .3, 1.7));
    ruleL.style.width = px(760 * r); ruleR.style.width = px(760 * r);
    ruleL.style.opacity = ruleR.style.opacity = .9;
    const a = E.out(sp(t, .55, 1.75));
    set(wrap, a, 0, lerp(20, 0, a) - 26 * E.io(sp(t, 4.9, 5.9)), lerp(.965, 1, a));
    chip.style.opacity = E.out(sp(t, 1.35, 2.0));
    set(sub, E.out(sp(t, 1.6, 2.5)) * .95, 0, lerp(12, 0, E.out(sp(t, 1.6, 2.5))) - 22 * E.io(sp(t, 4.9, 5.9)));
    const la = sp(t, 4.95, 5.95);
    set(line, E.out(la), 0, lerp(24, 0, E.out5(la)));
  };
}, { fin: .8, fout: .5 });

// ══════════════════════════════════════════════════════ 04 · LISTEN
scene('04-listen', root => {
  const p = h('div', 'pad'); root.appendChild(p);
  p.appendChild(h('div', 'kicker', { position:'absolute', left:'120px', top:'84px' },
                  '01 · Listen'));

  // Two doors, then the citizen one is the one we walk through.
  const doors = h('div', null, { position:'absolute', left:'0', right:'0', top:'300px',
    display:'flex', justifyContent:'center', gap:'150px' });
  const door = (label, gold) => {
    const d = h('div', null, { width:'250px', height:'400px', border:'1px solid var(--rule-strong)',
      borderBottom:'none', borderRadius:'126px 126px 0 0', position:'relative',
      background:'linear-gradient(180deg, rgba(236,229,216,.035), rgba(236,229,216,0))' });
    d.appendChild(h('div', 'mono', { position:'absolute', left:'0', right:'0', bottom:'-46px',
      textAlign:'center', fontSize:'20px', letterSpacing:'.26em',
      color: gold ? 'var(--gold)' : 'var(--paper-4)' }, label));
    d.appendChild(h('div', null, { position:'absolute', left:'50%', top:'214px', width:'9px',
      height:'9px', borderRadius:'50%', background:'var(--paper-4)' }));
    return d;
  };
  const dCit = door('CITIZEN', true), dOff = door('OFFICIAL', false);
  doors.appendChild(dCit); doors.appendChild(dOff); p.appendChild(doors);

  const CARDS = [
    { icon:'mic', name:'Speak',      buys:'REACH', copy:'No reading, no writing, no form — and no need to know which department owns the problem.' },
    { icon:'key', name:'Type',       buys:'SCALE', copy:'Web and Telegram, plus the millions of complaints already sitting in legacy government systems.' },
    { icon:'cam', name:'Photograph', buys:'PROOF', copy:'A voice note is a claim. A photograph is evidence — and it needs no language at all.' },
  ].map((c, i) => {
    const el = h('div', null, { position:'absolute', left:'120px', top:px(268 + i * 198),
      width:'880px', height:'168px', border:'1px solid var(--rule)', background:'var(--ink-800)',
      padding:'26px 30px' });
    const ico = h('div', null, { position:'absolute', left:'30px', top:'28px', width:'46px',
      height:'46px', color:'var(--paper-2)' });
    ico.innerHTML = svg(ICON[c.icon], 46, 1.2);
    const nm = h('div', null, { position:'absolute', left:'98px', top:'30px', fontSize:'38px',
      fontWeight:'500', letterSpacing:'-.01em' }, c.name);
    const bs = h('div', 'mono', { position:'absolute', right:'30px', top:'40px', fontSize:'21px',
      fontWeight:'500', letterSpacing:'.24em', color:'var(--gold)' }, c.buys);
    const cp = h('div', null, { position:'absolute', left:'98px', top:'88px', width:'700px',
      fontSize:'23px', lineHeight:'1.42', color:'var(--paper-3)' }, c.copy);
    [ico, nm, bs, cp].forEach(e => el.appendChild(e));
    p.appendChild(el);
    return { ...c, el, ico, nm, bs, cp };
  });

  const phone = h('img', 'ui', { position:'absolute', right:'120px', top:'250px', width:'318px',
    borderRadius:'26px' }); phone.src = 'assets/ui/intake-phone.png'; p.appendChild(phone);
  const pcap = h('div', 'mono', { position:'absolute', right:'120px', top:'946px', width:'318px',
    textAlign:'center', fontSize:'16px', lineHeight:'1.6', letterSpacing:'.13em',
    color:'var(--paper-4)' }, 'LIVE INTAKE · MARATHI IN, STRUCTURED OUT');
  p.appendChild(pcap);
  const langs = h('div', 'mono', { position:'absolute', left:'120px', top:'866px', fontSize:'20px',
    lineHeight:'1.75', letterSpacing:'.15em', color:'var(--paper-3)' },
    'MEASURED, NOT CLAIMED —  196 LANGUAGES TYPED  ·  56 FULL VOICE ROUND-TRIP  ·  IMAGE NEEDS NONE\nWEB  ·  TELEGRAM  ·  ONE GEMINI CALL HANDLES ALL THREE MODALITIES');
  langs.style.whiteSpace = 'pre-line'; p.appendChild(langs);

  return t => {
    // 0 – 2.4 the doors; then they hand off to the citizen channels.
    const dA = E.out(sp(t, .3, 1.5)), gone = E.io(sp(t, 1.95, 2.75));
    set(doors, dA * (1 - gone), 0, lerp(0, -40, gone), lerp(1, 1.06, gone));
    dCit.style.borderColor = `rgba(243,193,75,${lerp(.22, .8, E.out(sp(t, 1.0, 1.9)))})`;
    dOff.style.opacity = lerp(1, .35, E.io(sp(t, 1.0, 1.9)));

    CARDS.forEach((c, i) => {
      const t0 = 2.6 + i * .34;
      const a = E.out(sp(t, t0, t0 + .8));
      // Each channel takes the stage exactly while it is being narrated.
      const win = [[10.7, 14.6], [14.6, 18.7], [18.7, 21.9]][i];
      const on = sp(t, win[0], win[0] + .45) * (1 - sp(t, win[1], win[1] + .45));
      set(c.el, a * lerp(.5, 1, on), lerp(-34, 0, a), 0, lerp(.985, 1, a));
      c.el.style.borderColor = `rgba(243,193,75,${lerp(0, .55, on)})`;

scene('05-decide', root => {
  const p = h('div', 'pad'); root.appendChild(p);

                  '02 · Decide'));

    width:'1680px', height:'150px' });

  const chip = (x, w, label, sub, gold) => {
    const c = h('div', null, { position:'absolute', left:px(x), top:'34px', width:px(w),

      textAlign:'center', fontSize:'15px', letterSpacing:'.16em', color:'var(--paper-4)' }, sub));
    flow.appendChild(c); return c;
  };
  const cIn  = chip(0,   400, 'VOICE · TEXT · IMAGE', 'ANY LANGUAGE', false);
  const cGem = chip(500, 400, 'GEMINI', 'ONE CALL · ALL THREE', false);
  const cBQ  = chip(1000, 400, 'BIGQUERY', 'STRUCTURED SIGNALS', false);
  const cGov = chip(640, 400, 'NFHS-5 · CENSUS 2011', 'GOVERNMENT OF INDIA', true);
  const arrows = [[400, 100], [900, 100]].map(([x, w]) => {
    const a = h('div', null, { position:'absolute', left:px(x + 14), top:'76px',
      width:px(w - 28), height:'1px', background:'var(--rule-strong)' });

      borderRadius:'50%', background:'var(--gold)' });
    flow.appendChild(dot);
    return { a, dot, x: x + 14, w: w - 28 };
  });

  // Dedup: a swarm of reports collapsing into one distinct need.
  const swarm = h('div', null, { position:'absolute', left:'120px', top:'470px',
    width:'1680px', height:'470px', overflow:'hidden' });
  p.appendChild(swarm);
  const CX = 840, CY = 150;
  const motes = [];
  for (let i = 0; i < 300; i++) {
    const a = rnd() * Math.PI * 2, r = 90 + Math.pow(rnd(), .48) * 640;
    const el = h('div', null, { position:'absolute', width:'6px', height:'6px', borderRadius:'50%',
      background:'var(--q-act)' });
    swarm.appendChild(el);
    motes.push({ el, x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r * .34, d: rnd() });
  }
  const core = h('div', null, { position:'absolute', left:px(CX - 44), top:px(CY - 44),
    width:'88px', height:'88px', borderRadius:'50%', border:'1px solid var(--gold)' });
  swarm.appendChild(core);
  const num = h('div', 'mono', { position:'absolute', left:'0', right:'0', top:'300px',
    textAlign:'center', fontSize:'86px', fontWeight:'500', color:'var(--gold)' }, '800');
  const lab = h('div', 'mono', { position:'absolute', left:'0', right:'0', top:'406px',
    textAlign:'center', fontSize:'21px', letterSpacing:'.26em', color:'var(--paper-3)' },
    'REPORTS ABOUT ONE DRY BOREWELL');
  swarm.appendChild(num); swarm.appendChild(lab);

  const grid = h('div', null, { position:'absolute', left:'660px', top:'396px', width:'600px',
    height:'420px' });
  p.appendChild(grid);
  const gv = h('div', 'rule', { position:'absolute', left:'300px', top:'0', width:'1px' });
  const gh = h('div', 'rule', { position:'absolute', left:'0', top:'210px', height:'1px' });
  const gb = h('div', null, { position:'absolute', inset:'0', border:'1px solid var(--rule)' });
  grid.appendChild(gb); grid.appendChild(gv); grid.appendChild(gh);
  const gcap = h('div', 'mono', { position:'absolute', left:'0', right:'0', top:'446px',
    textAlign:'center', fontSize:'21px', letterSpacing:'.26em', color:'var(--paper-3)' },
    'FOUR BOXES');
  grid.appendChild(gcap);

  return t => {
    // masthead: the official's door, opening
    const mA = E.out(sp(t, .35, 1.6));
    set(mast, mA * (1 - E.io(sp(t, 4.4, 5.4))), 0, lerp(-26, 0, E.out5(sp(t, .35, 1.8))));

    // Held at 0.28 rather than removed: the collapse needs something above it,
    // and the pipeline is the context for what is collapsing.
    const fOut = .72 * E.io(sp(t, 4.6, 5.6)) + .28 * E.io(sp(t, 12.9, 13.9));
    [cIn, cGem, cBQ].forEach((c, i) => {
      const a = E.out(sp(t, 2.0 + i * .3, 2.9 + i * .3));
      set(c, a * (1 - fOut), lerp(-18, 0, a), 0);
    });
    arrows.forEach((ar, i) => {
      const a = E.out(sp(t, 2.5 + i * .3, 3.3 + i * .3));
      ar.a.style.width = px(ar.w * a); ar.a.style.opacity = a * (1 - fOut);
      // one travelling dot per arrow, phase-offset so the flow reads as motion
      const ph = ((t * .85 + i * .5) % 1);
      ar.dot.style.left = px(ar.x + ar.w * ph);
      ar.dot.style.opacity = a * (1 - fOut) * Math.sin(ph * Math.PI) * .95;
    });

    // 4.9 – 11.4 : the collapse
    const col = E.io(sp(t, 5.6, 9.5));
    const sA = E.out(sp(t, 4.9, 5.7)), sOut = E.io(sp(t, 12.4, 13.6));
    for (const m of motes) {
      const own = cl((col - m.d * .34) / .66);
      const x = lerp(m.x, CX, E.out(own)), y = lerp(m.y, CY, E.out(own));
      m.el.style.left = px(x - 3); m.el.style.top = px(y - 3);
      m.el.style.opacity = sA * (1 - sOut) * lerp(.85, 0, cl((own - .72) / .28));
      m.el.style.transform = `scale(${lerp(1, .45, own)})`;
    }
    const cA = E.out(sp(t, 8.4, 9.7));
    set(core, cA * (1 - sOut), 0, 0, lerp(1.5, 1, cA));
    core.style.boxShadow = `0 0 ${lerp(0, 40, cA)}px rgba(243,193,75,.42)`;
    const n = Math.round(lerp(800, 1, E.out5(sp(t, 5.9, 9.4))));
    num.textContent = String(n);
    set(num, sA * (1 - sOut));
    lab.textContent = n <= 1 ? '1 DISTINCT NEED · NOT EIGHT HUNDRED'
                             : 'REPORTS ABOUT ONE DRY BOREWELL';
    set(lab, sA * (1 - sOut) * .95);

    // 10.6 – 13.0 : government data joins
    const gA = E.out(sp(t, 10.55, 11.6));
    set(cGov, gA * (1 - E.io(sp(t, 12.9, 13.8))), 0, lerp(-120, -186, E.out5(sp(t, 10.55, 11.9))));

    // 13.0 → : the grid that scene 06 inherits
    const grA = E.out(sp(t, 13.0, 14.3));
    set(grid, grA, 0, 0, lerp(.9, 1, grA));
    const draw = E.out5(sp(t, 13.2, 14.8));
    gv.style.height = px(420 * draw); gh.style.width = px(600 * draw);
    set(gcap, E.out(sp(t, 14.4, 15.3)) * .9);
  };
});

      const outA = E.io(sp(t, P.win[1], P.win[1] + .6));
      const a = inA * (1 - outA);

          lerp(.975, 1, inA));
      set(P.cap, a * .95, lerp(30, 0, E.out(sp(t, P.win[0] + .3, P.win[0] + 1.3))));
    });

    set(close, E.out(sp(t, 30.5, 31.6)) * .95, 0, lerp(14, 0, E.out(sp(t, 30.5, 31.6))));
  };
}, { fin: .45, fout: .5 });

// ────────────────────────────────────────────────────────────────── captions
/** Sentence cues per scene, apportioned by character count — the same split
 *  scripts/video/assemble.py writes into the .srt, so the burnt-in captions and
 *  the sidecar never disagree. */
const CUES = (() => {
  const out = [];
  for (const sc of T.scenes) {
    const parts = sc.vo.split(/(?<=[.?!])\s+/).map(x => x.trim()).filter(Boolean);
    const merged = [];
    for (const p of parts) {
      if (merged.length && (p.length < 28 || merged[merged.length - 1].length < 28))
        merged[merged.length - 1] += ' ' + p;
      else merged.push(p);
    }
    const tot = merged.reduce((a, p) => a + p.length, 0) || 1;
    let t = sc.start;
    for (const p of merged) {
      const d = sc.speech * p.length / tot;
      out.push({ a: t, b: t + d, s: p });
      t += d;
    }
  }
  return out;
})();

// ─────────────────────────────────────────────────────────────────── the seek
const prog = document.getElementById('progress');
const chap = document.getElementById('chapter');
const cap = document.getElementById('caption');

/** The whole film as a pure function of time. Called once per output frame. */
window.SEEK = function (time) {
  const t = Math.max(0, Math.min(T.total - 1e-4, time));
  let cur = T.scenes[0];
  for (const s of T.scenes) if (t >= s.start) cur = s;

  for (const s of T.scenes) {
    const o = SC[s.id];
    if (o) o.root.style.display = (s.id === cur.id) ? 'block' : 'none';
  }
  const o = SC[cur.id];
  if (o) {
    const local = t - cur.start;
    // Scene-level dissolve. Against the ink ground this reads as a soft cut.
    const fade = Math.min(sp(local, 0, o.fin), sp(cur.dur - local, 0, o.fout));
    o.root.style.opacity = fade;
    o.render(local, cur.dur);
  }
  if (window.__CAPTIONS) {
    const c = CUES.find(q => t >= q.a && t < q.b);
    cap.style.display = c ? 'block' : 'none';
    if (c) {
      cap.textContent = c.s;
      // 0.12s ease-in on each cue: a caption that hard-cuts reads as a glitch.
      cap.style.opacity = sp(t - c.a, 0, .12) * (1 - sp(t, c.b - .1, c.b) * .0);
    }
  }
  prog.style.width = px(W * (t / T.total));
  chap.textContent = cur.label.toUpperCase();
  chap.style.opacity = .5;
  document.documentElement.dataset.t = t.toFixed(3);
};

// Interactive scrub, for previewing straight from the filesystem.
if (!window.__RENDERING) {
  let t = 0;
  SEEK(0);
  const bar = h('input', null, { position:'fixed', left:'20px', right:'20px', bottom:'8px',
    width:'calc(100% - 40px)', zIndex:'99' });
  bar.type = 'range'; bar.min = 0; bar.max = T.total; bar.step = 1 / T.fps; bar.value = 0;
  bar.oninput = () => SEEK(t = +bar.value);
  document.body.appendChild(bar);
  addEventListener('keydown', e => {
    const d = e.shiftKey ? 1 : 1 / T.fps;
    if (e.key === 'ArrowRight') t = Math.min(T.total, t + d);
    else if (e.key === 'ArrowLeft') t = Math.max(0, t - d);
    else return;
    bar.value = t; SEEK(t);
  });
}
