# GATE 1 — geo-grounding test set. 50 hand-built cases.
#
# plan.md calls building this "the most valuable hour of the week", and it is
# authored BEFORE the resolver exists, on purpose: a test set written after the
# resolver is a test of what the resolver already does, not of what the product
# needs. Nothing in scripts/geo_ground.py existed when this file was committed.
#
# **Stated limitation.** These cases are authored by the same party that builds
# the resolver, so this is a self-graded exam. Writing it first constrains the
# grading but does not eliminate the bias, and no accuracy figure derived from it
# should be presented as an independent evaluation. It is a build gate, not a
# benchmark.
#
# Ground truth is an `admin_unit_code` from data/dim_admin_unit.csv, or `null`
# where a competent human could not resolve the text either. The null cases carry
# equal weight: a resolver that confidently invents a district for "in our
# village" is worse than one that abstains, because every downstream score
# inherits the error silently.
#
# Difficulty tiers:
#   T1 explicit    district named outright
#   T2 variant     district named, but spelled differently from the boundary file
#   T3 subunit     only a town, block or tehsil is named
#   T4 landmark    only a physical or cultural feature is named
#   T5 ambiguous   the name exists in more than one state
#   T6 abstain     genuinely unresolvable; the correct answer is null

meta:
  version: 1
  authored: 2026-08-15
  authored_before_resolver: true
  cases: 50
  gate_threshold: 0.85
  scoring: >
    A case is correct when the predicted admin_unit_code equals expected exactly,
    or when both are null. Abstain cases count toward the same total as any other.

cases:
