# CIVOS-IN — sector model (SPEC §7).
#
# Each sector binds three things: the official deficit indicator that measures it,
# the funding route that can pay for it, and the visual asset types vision should
# recognise in a citizen photograph. The indicator↔scheme binding is chosen to
# serve the funding route — a recommendation with no funding route is a wish.
#
# `indicator.measures` records the settlement type the indicator is computed over.
# It is what makes scheme eligibility checkable: a deficit measured on villages
# cannot justify a scheme whose published scope is statutory towns. A scheme is
# eligible when its `applies_to` overlaps this — rural against `both` is fine,
# urban against `rural` is not.
#
# Nothing here may move into core/. The country lint enforces that.

country_code: IN
instance: CIVOS-IN

sectors:
  - key: water_sanitation
    label: Water & Sanitation
    short: Water
    sdg: [6]
    indicator:
      primary: pct_households_no_improved_water
      # NFHS-5 samples rural and urban households in every district
      measures: both
      label: Households without an improved drinking water source
      secondary: pct_households_no_improved_sanitation
      source: NFHS-5 district factsheets
      year: 2021
    schemes: [jal_jeevan_mission, swachh_bharat_gramin]
    asset_types: [handpump, borewell, standpost, toilet_block, drain, overhead_tank]

  - key: roads_transport
    label: Roads & Transport
    short: Roads
    sdg: [9, 11]
    indicator:
      # VILLAGES, not habitations. PMGSY counts habitations (a village may hold
      # several); the Census Village Directory counts villages. The available open
      # source is the Census, so the label names the unit actually measured —
      # calling these habitations would misdescribe the data by a factor nobody
      # could audit.
      primary: pct_villages_no_pucca_road
      # The Village Directory counts villages. It has no urban universe at all, so an urban roads scheme cannot be justified from it
      measures: rural
      label: Villages without a black-topped (pucca) road
      source: Census 2011 Village Directory (MHA / ORGI)
      year: 2011
      # Disclosed because it is real and it matters. All ten Village Directory road
      # columns were screened for state-level coding artefacts; this one is the
      # cleanest, but coding still varies between states. Kerala reports 0.0% in
      # all 14 districts, which is credible. Jharkhand's 1.7% median is not, for a
      # state where PMGSY runs priority programmes, and Ballia and Mau in Uttar
      # Pradesh both sit at 100%. Cross-state comparison on this sector is weaker
      # than on the four NFHS-5 sectors, and the interface says so.
      caveat: >
        Census enumerators recorded this field inconsistently between states.
        Within-state comparison is sound; cross-state comparison is weaker than for
        the NFHS-5 sectors. Jharkhand in particular reads as better connected than
        is plausible. See docs/ROADS-INDICATOR.md.
    schemes: [pmgsy, amrut]
    asset_types: [road_surface, culvert, bridge, bus_stop, footpath]

  - key: electricity
    label: Electricity
    short: Power
    sdg: [7]
    indicator:
      primary: pct_households_no_electricity
      # NFHS-5 household electrification covers both settings
      measures: both
      label: Households without an electricity connection
      source: NFHS-5; NITI National MPI
      year: 2021
    schemes: [rdss, ddugjy]
    asset_types: [transformer, pole, street_light, service_line, feeder]

  - key: health
    label: Health Facilities
    short: Health
    sdg: [3]
    indicator:
      primary: pct_births_non_institutional
      # NFHS-5 institutional births are recorded across both settings
      measures: both
      label: Births not delivered in a health facility
      source: NFHS-5; Rural Health Statistics
      year: 2021
    schemes: [national_health_mission, ayushman_bharat_hwc]
    asset_types: [phc_building, sub_centre, ambulance_access_road, waiting_area]

  - key: education
    label: Education
    short: Education
    sdg: [4]
    indicator:
      primary: pct_children_out_of_school
      # NFHS-5 school attendance is recorded across both settings
      measures: both
      label: Children of school age not attending school
      source: NFHS-5; NITI National MPI
      year: 2021
    schemes: [samagra_shiksha, pm_shri]
    asset_types: [school_building, classroom, boundary_wall, school_toilet, playground]

# Physical condition flags are country-agnostic and live in core/. Listed here
# only so adapter authors can see the vocabulary vision will return.
condition_flags_reference:
  - structurally_unsafe
  - standing_water
  - unusable
  - partially_functional
