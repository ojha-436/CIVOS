# CIVOS-IN — the channels a citizen can reach this instance on.
#
# The number and the words spoken down the line are country configuration, not
# code. A second country brings its own operator, its own number and its own
# prompt; nothing in core/ or api/channels/telephony.py changes.
#
# The prompt is deliberately two short sentences. Somebody who dialled to report
# a broken handpump did not call to listen to an IVR, and every second before the
# beep is a second in which they hang up.

country_code: IN

voice:
  provider: vobiz
  # Public. This is the number printed on the site for citizens to dial.
  number: "+918065354620"
  display: "080 6535 4620"
  # Vobiz text-to-speech covers en-IN and hi-IN here. This bounds the PROMPT
  # only — what the citizen says back is recorded and understood by the same
  # Gemini multimodal call every other channel uses, in any language it supports.
  prompt_primary_language: hi-IN
  prompt_primary: >
    नमस्कार। बीप के बाद अपनी समस्या अपनी भाषा में बताइए, और अपने ज़िले का नाम
    ज़रूर बोलिए।
  prompt_secondary_language: en-IN
  prompt_secondary: >
    After the beep, describe the problem in your own language, and please say
    the name of your district.
  max_record_seconds: 90

# Vobiz carries voice and WhatsApp; it has no SMS send API. The SMS endpoint
# stays in place for a gateway that does, and reports itself unconfigured until
# one is attached rather than implying a channel that cannot deliver.
sms:
  provider: null
